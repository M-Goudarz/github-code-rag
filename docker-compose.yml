services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-code-rag-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-GitHub Code RAG}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@localhost:5432/github_rag}
    restart: unless-stopped